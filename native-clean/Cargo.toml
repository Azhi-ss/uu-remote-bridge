[package]
name = "uu-remote-clean"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room UU Remote host/viewer core with an optional terminal client"

[[bin]]
name = "uu-remote-clean"
path = "src/main.rs"

[features]
default = ["viewer-terminal"]
viewer-terminal = []
host-terminal = []
desktop = []

[dependencies]
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
url = "2"
webrtc = "0.10"

[dev-dependencies]
rcgen = "0.11"
